name: Non-scoring tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Run source non-scoring tests
        run: python -m unittest discover -s src -p "test*.py"
      - name: Run workflow and repository tests
        run: python -m unittest discover -s tests -p "test*.py"
